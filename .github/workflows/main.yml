name: CI/CD - App Interna CESFAM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cesfam-despliegue-main
  cancel-in-progress: false

jobs:
  compilar-y-probar:
    name: Compilar y probar - ${{ matrix.servicio.nombre }}
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        servicio:
          - nombre: Funcionarios
            ruta: CesfamInterno/CesfamInterno
            base_datos: cesfam_interno_db
          - nombre: Estacionamiento
            ruta: estacionamiento-service/estacionamiento-service
            base_datos: estacionamiento_db
          - nombre: Notificaciones
            ruta: notificaciones-service/notificaciones-service
            base_datos: notificaciones_db
          - nombre: Presencia
            ruta: presencia-disponibilidad-service/presencia-disponibilidad-service
            base_datos: presencia_disponibilidad_db

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/${{ matrix.servicio.base_datos }}?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
      DB_USERNAME: root
      DB_PASSWORD: root123

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.servicio.ruta }}/pom.xml

      - name: Compilar y ejecutar pruebas
        working-directory: ${{ matrix.servicio.ruta }}
        run: bash ./mvnw clean verify

  construir-y-publicar:
    name: Docker - ${{ matrix.servicio.nombre }}
    needs: compilar-y-probar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        servicio:
          - nombre: Funcionarios
            ruta: CesfamInterno/CesfamInterno
            imagen: cesfam-funcionarios
          - nombre: Estacionamiento
            ruta: estacionamiento-service/estacionamiento-service
            imagen: cesfam-estacionamiento
          - nombre: Notificaciones
            ruta: notificaciones-service/notificaciones-service
            imagen: cesfam-notificaciones
          - nombre: Presencia
            ruta: presencia-disponibilidad-service/presencia-disponibilidad-service
            imagen: cesfam-presencia

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generar archivo JAR
        working-directory: ${{ matrix.servicio.ruta }}
        run: bash ./mvnw package -DskipTests

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio.ruta }}
          file: ./${{ matrix.servicio.ruta }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.servicio.imagen }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.servicio.imagen }}:${{ github.sha }}

  desplegar-infraestructura:
    name: Desplegar infraestructura - CloudFormation
    needs: construir-y-publicar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Validar plantilla CloudFormation
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/aws/template.yaml \
            --region us-east-1 \
            --no-cli-pager

      - name: Desplegar infraestructura AWS
        run: |
          aws cloudformation deploy \
            --template-file infra/aws/template.yaml \
            --stack-name cesfam-infra-test \
            --parameter-overrides \
              NombreCola=cesfam-notificaciones-test \
              NombreLambda=cesfam-procesar-notificaciones-test \
              ArnRolLambda=arn:aws:iam::654654475821:role/LabRole \
            --region us-east-1 \
            --no-fail-on-empty-changeset \
            --no-cli-pager

      - name: Verificar recursos desplegados
        run: |
          aws cloudformation describe-stack-resources \
            --stack-name cesfam-infra-test \
            --region us-east-1 \
            --output table \
            --no-cli-pager

  desplegar-en-aws:
    name: Desplegar en AWS - Docker Swarm
    needs: desplegar-infraestructura
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SECURITY_GROUP_ID: sg-0ced99d3f0f7f3f08
      AWS_REGION: us-east-1

    steps:
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Verificar autenticacion con AWS
        run: |
          aws sts get-caller-identity

      - name: Detectar IP publica del runner
        id: runner-ip
        run: |
          set -euo pipefail

          RUNNER_IP="$(curl -4 -fsS --retry 3 --max-time 15 https://checkip.amazonaws.com | tr -d '[:space:]')"

          python3 -c 'import ipaddress, sys; ipaddress.IPv4Address(sys.argv[1])' "$RUNNER_IP"

          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

          echo "IP publica del runner: $RUNNER_IP"

      - name: Autorizar acceso SSH temporal
        id: autorizar-ssh
        env:
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -euo pipefail

          RULE_ID="$(aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32,Description=GitHub-Actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}]" \
            --region "$AWS_REGION" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)"

          [[ "$RULE_ID" == sgr-* ]]

          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"

          echo "Acceso SSH temporal autorizado: $RUNNER_IP/32"
          echo "Regla creada: $RULE_ID"

          sleep 10

      - name: Configurar SSH y verificar identidad del servidor
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2

          printf '%s %s\n' "$EC2_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verificar conexion SSH y Docker Swarm
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ec2 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            'sudo -n docker info --format "{{.Swarm.LocalNodeState}} | Manager: {{.Swarm.ControlAvailable}}"'

      - name: Actualizar microservicios en Docker Swarm
        timeout-minutes: 12
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ec2 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            "IMAGE_OWNER='$IMAGE_OWNER' IMAGE_TAG='$IMAGE_TAG' bash -se" <<'REMOTE'
          set -euo pipefail

          OWNER="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"

          actualizar() {
            servicio="$1"
            imagen="$2"
            nueva_imagen="ghcr.io/$OWNER/$imagen:$IMAGE_TAG"

            echo "Actualizando $servicio"

            sudo -n docker service inspect "$servicio" >/dev/null

            sudo -n docker service update \
              --update-failure-action rollback \
              --image "$nueva_imagen" \
              "$servicio"

            imagen_actual="$(sudo -n docker service inspect "$servicio" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"

            if [[ "$imagen_actual" != "$nueva_imagen" && "$imagen_actual" != "$nueva_imagen"@sha256:* ]]; then
              echo "ERROR: El servicio no utiliza la imagen esperada"
              exit 1
            fi

            echo "Actualizado: $servicio"
          }

          echo "Configurando escalabilidad de Funcionarios"

          sudo -n docker service update \
            --replicas-max-per-node 1 \
            cesfam_funcionarios

          actualizar cesfam_funcionarios cesfam-funcionarios
          actualizar cesfam_estacionamiento cesfam-estacionamiento
          actualizar cesfam_notificaciones cesfam-notificaciones
          actualizar cesfam_presencia cesfam-presencia

          echo "Verificando configuracion de escalabilidad:"
          sudo -n docker service inspect cesfam_funcionarios \
            --format '{{json .Spec.TaskTemplate.Placement}}'

          echo "Estado final de los servicios:"
          sudo -n docker service ls

          echo "Distribucion de replicas de Funcionarios:"
          sudo -n docker service ps cesfam_funcionarios \
            --filter desired-state=running

          REMOTE

      - name: Retirar acceso SSH temporal
        if: ${{ always() && steps.autorizar-ssh.outputs.rule_id != '' }}
        env:
          RULE_ID: ${{ steps.autorizar-ssh.outputs.rule_id }}
        run: |
          set -euo pipefail

          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --security-group-rule-ids "$RULE_ID" \
            --region "$AWS_REGION"

          echo "Regla SSH temporal eliminada correctamente"

      - name: Limpiar archivos SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_ec2 ~/.ssh/known_hosts