
services:

  funcionarios:
    image: cesfam-funcionarios:1.0
    container_name: cesfam-funcionarios
    ports:
      - "8081:8081"
    environment:
      DB_URL: "jdbc:mysql://host.docker.internal:3306/cesfam_interno_db?createDatabaseIfNotExist=true&serverTimezone=America/Santiago"
      DB_USERNAME: root
      DB_PASSWORD: ""

  presencia:
    image: cesfam-presencia:1.0
    container_name: cesfam-presencia
    ports:
      - "8082:8082"
    environment:
      DB_URL: "jdbc:mysql://host.docker.internal:3306/presencia_disponibilidad_db?createDatabaseIfNotExist=true&serverTimezone=America/Santiago"
      DB_USERNAME: root
      DB_PASSWORD: ""

  notificaciones:
    image: cesfam-notificaciones:1.0
    container_name: cesfam-notificaciones
    ports:
      - "8083:8083"
    environment:
      DB_URL: "jdbc:mysql://host.docker.internal:3306/notificaciones_db?createDatabaseIfNotExist=true&serverTimezone=America/Santiago"
      DB_USERNAME: root
      DB_PASSWORD: ""
      API_USERNAME: ${API_USERNAME:?Debes configurar API_USERNAME}
      API_PASSWORD: ${API_PASSWORD:?Debes configurar API_PASSWORD}


  estacionamiento:
    image: cesfam-estacionamiento:1.0
    container_name: cesfam-estacionamiento
    ports:
      - "8084:8084"
    environment:
      DB_URL: "jdbc:mysql://host.docker.internal:3306/estacionamiento_db?createDatabaseIfNotExist=true&serverTimezone=America/Santiago"
      DB_USERNAME: root
      DB_PASSWORD: ""
