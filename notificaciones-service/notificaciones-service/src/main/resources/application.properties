spring.application.name=notificaciones-service
server.port=8083

# Conexion a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notificaciones_db?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Credenciales para Postman
spring.security.user.name=${API_USERNAME:debo}
spring.security.user.password=${API_PASSWORD:123}

# Configuracion AWS
aws.region=${AWS_REGION:us-east-1}

# Configuracion Amazon SQS
aws.sqs.enabled=${AWS_SQS_ENABLED:false}
aws.sqs.queue-url=${AWS_SQS_QUEUE_URL:}